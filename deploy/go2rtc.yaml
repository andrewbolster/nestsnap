# Credentials come from /etc/nestsnap/nest.env via the environment; go2rtc expands ${VAR}.
# API and RTSP listen on localhost only: go2rtc's UI shows stream sources, which carry the token.
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: "127.0.0.1:8554"
webrtc:
  listen: ""
streams:
  living_room: "nest:?client_id=${NEST_CLIENT_ID}&client_secret=${NEST_CLIENT_SECRET}&refresh_token=${NEST_REFRESH_TOKEN}&project_id=${NEST_PROJECT_ID}&device_id=${NEST_DEVICE_ID}"
